<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChangThai-Zmittag</title>
<meta name="description" content="Sammelbestellung bei ChangThai: Menüs erfassen, WhatsApp-Bestellung erzeugen, Beträge pro Person verschicken.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#F3F5F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111813" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ChangThai">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>html{-webkit-text-size-adjust:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: one-column phone app, sticky header, bottom tab bar, bottom sheet for adding a dish */
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --ink:#18261D; --muted:#5E6B62; --line:#DCE2DA;
  --basil:#2E6A40; --basil-soft:#E3EEE5; --chili:#C7402A; --curry:#D99A1E; --curry-soft:#FBF0D6;
  --wa:#1F8A4C;
  --f-display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111813; --surface:#19231C; --ink:#E7EEE8; --muted:#9AA89E; --line:#2B382F;
  --basil:#6FBF85; --basil-soft:#1F3326; --chili:#F0735B; --curry:#EDB84A; --curry-soft:#33291A; --wa:#4CC27E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111813; --surface:#19231C; --ink:#E7EEE8; --muted:#9AA89E; --line:#2B382F;
  --basil:#6FBF85; --basil-soft:#1F3326; --chili:#F0735B; --curry:#EDB84A; --curry-soft:#33291A; --wa:#4CC27E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line);margin-bottom:14px}
header h1{font-family:var(--f-display);font-weight:800;font-size:1.5rem;margin:0;letter-spacing:-.01em}
header p{margin:2px 0 0;color:var(--muted);font-size:.85rem}
h2{font-family:var(--f-display);font-weight:600;font-size:1.15rem;margin:22px 0 8px;text-wrap:balance}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--curry);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:700;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn.primary{background:var(--basil);border-color:var(--basil);color:var(--bg)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:var(--bg)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px;font-size:.85rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:10px}
input[type=text],input[type=tel],input[type=number],input[type=time],textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
textarea{min-height:80px;resize:vertical}
.field{display:grid;gap:4px;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* people */
.person{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}
.person-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.person-name{font-weight:700;font-size:1.05rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--basil-soft);border-radius:8px;padding:5px 6px 5px 10px;font-size:.88rem}
.chip b{font-variant-numeric:tabular-nums}
.chip button{border:0;background:transparent;color:var(--muted);font-size:1.1rem;line-height:1;padding:0 4px}
.add{border:1.5px dashed var(--basil);color:var(--basil);background:transparent;border-radius:8px;padding:5px 10px;font-weight:700;font-size:.88rem}
.del{border:0;background:transparent;color:var(--chili);font-size:.85rem;font-weight:700}

/* summary strip */
.strip{display:flex;gap:16px;background:var(--curry-soft);border-radius:var(--r);padding:10px 14px;margin-bottom:12px}
.strip div{display:grid}
.strip strong{font-family:var(--f-display);font-size:1.3rem;font-variant-numeric:tabular-nums}

/* message */
.msg{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--wa);border-radius:10px;padding:14px;font-size:.95rem;overflow-wrap:anywhere}
.note{font-size:.85rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}

/* bill */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
td.r,th.r{text-align:right}
.payee{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}
.payee .amt{font-family:var(--f-display);font-weight:800;font-size:1.25rem;font-variant-numeric:tabular-nums}
.switch{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.switch input{width:22px;height:22px;accent-color:var(--basil)}

/* menu editor */
.prot{display:grid;grid-template-columns:1fr 64px 64px 32px;gap:6px;align-items:center}
.prot input{padding:8px}

/* tabs */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav .tabs{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{border:0;background:transparent;padding:10px 2px 12px;font-weight:700;font-size:.82rem;color:var(--muted);display:grid;justify-items:center;gap:2px}
nav button svg{width:22px;height:22px}
nav button[aria-selected=true]{color:var(--basil)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,14,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-weight:700;text-align:left}
.seg button small{display:block;font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.seg button[aria-pressed=true]{background:var(--basil);border-color:var(--basil);color:var(--bg)}
.seg button[aria-pressed=true] small{color:var(--bg)}
.seg.spice button[aria-pressed=true]{background:var(--chili);border-color:var(--chili)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.3rem;font-weight:700}
.stepper span{font-family:var(--f-display);font-size:1.4rem;min-width:2ch;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:700;z-index:30}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1 style="display:flex;align-items:center;gap:10px"><img src="icons/icon-192.png" alt="" width="40" height="40" style="border-radius:10px;background:#fff">ChangThai-Zmittag</h1>
    <p id="sub">Bestellung bei ChangThai</p>
  </header>
  <main id="view"></main>
</div>

<nav><div class="tabs" role="tablist">
  <button role="tab" data-tab="order" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Bestellen</button>
  <button role="tab" data-tab="msg" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v11H9l-5 4z"/></svg>Nachricht</button>
  <button role="tab" data-tab="bill" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>Abrechnen</button>
  <button role="tab" data-tab="menu" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>Menü</button>
</div></nav>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script>
const KEY = "changthai-app-v1";
const HAS_CONTACTS = "contacts" in navigator && "select" in navigator.contacts;
const uid = () => Math.random().toString(36).slice(2, 9);

const DEFAULTS = () => {
  const dishes = [
    { id: "curry", name: "Panang Curry", short: "Curry", join: "" },
    { id: "nudeln", name: "Gebratene Reisnudeln (Pad Sen)", short: "Gebr. Nudeln", join: "m/" },
    { id: "reis", name: "Gebratener Reis (Kao Pad)", short: "Gebr. Reis", join: "m/" },
  ];
  const proteins = [
    { id: "ente", name: "Ente", msg: "Ente", small: 16, large: 18 },
    { id: "rind", name: "Weide Rind", msg: "Rind", small: 16, large: 18 },
    { id: "poulet", name: "Poulet", msg: "Poulet", small: 15, large: 17 },
    { id: "vegi", name: "Vegi", msg: "Veggie", small: 12, large: 14 },
    { id: "tofu", name: "Tofu", msg: "Tofu", small: 13, large: 15 },
    { id: "crev", name: "Crevetten (nur Vorbestellung)", msg: "Crevetten", small: 16, large: 18 },
  ];
  const people = [], orders = [];
  return {
    settings: { time: "12:45", sender: "", greeting: "Hoi zäme", thanks: "Vielen Dank im Voraus!",
      ctPhone: "41799223322", payNote: "Bitte per TWINT an mich überweisen. Merci!" },
    menu: { dishes, proteins, spices: ["basisscharf", "CH-scharf", "Thai-scharf"] },
    people, orders,
    bill: { paid: "" },
    isExample: false,
  };
};

let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || DEFAULTS(); } catch (e) { S = DEFAULTS(); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

let tab = "order", editPeople = false;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const chf = n => "CHF " + n.toFixed(2);
const r05 = n => Math.round(n * 20) / 20;

const dish = id => S.menu.dishes.find(d => d.id === id) || { short: "?", join: "" };
const prot = id => S.menu.proteins.find(p => p.id === id) || { msg: "?", small: 0, large: 0 };
const unit = o => { const p = prot(o.protein); return Number(o.size === "gross" ? p.large : p.small) || 0; };
const label = o => { const d = dish(o.dish); return [d.short, d.join, prot(o.protein).msg, o.size, o.spice].filter(Boolean).join(" "); };

function aggregated() {
  const map = new Map();
  for (const o of S.orders) {
    const k = label(o);
    const di = S.menu.dishes.findIndex(d => d.id === o.dish), pi = S.menu.proteins.findIndex(p => p.id === o.protein);
    const sort = [di, pi, o.size === "gross" ? 0 : 1, S.menu.spices.indexOf(o.spice)];
    const e = map.get(k) || { label: k, qty: 0, sort };
    e.qty += o.qty; map.set(k, e);
  }
  return [...map.values()].sort((a, b) => { for (let i = 0; i < 4; i++) if (a.sort[i] !== b.sort[i]) return a.sort[i] - b.sort[i]; return 0; });
}
const countAll = () => S.orders.reduce((s, o) => s + o.qty, 0);
const listTotal = () => S.orders.reduce((s, o) => s + unit(o) * o.qty, 0);

function orderMessage() {
  const s = S.settings;
  const lines = aggregated().map(e => `* ${e.qty}x ${e.label}`).join("\n");
  return `${s.greeting}\n\nFür ${s.time} bitte\n\n${lines}\n\n\n${s.thanks}\n\nGruss\n\n${s.sender}`;
}

function bill() {
  const total = listTotal();
  const entered = parseFloat(String(S.bill.paid).replace(",", "."));
  const paid = isFinite(entered) && entered > 0 ? entered : total;
  const discount = total - paid;
  const f = total ? paid / total : 1;
  const rows = S.people.map(p => {
    const mine = S.orders.filter(o => o.personId === p.id);
    const list = mine.reduce((s, o) => s + unit(o) * o.qty, 0);
    return { p, mine, list, exact: list * f, share: r05(list * f) };
  }).filter(r => r.list > 0);
  return { total, discount, paid, f, rows };
}

function payMessage(r) {
  const s = S.settings, b = bill();
  const d = new Date().toLocaleDateString("de-CH");
  const items = r.mine.map(o => `* ${o.qty}x ${label(o)} (${chf(unit(o) * o.qty)})`).join("\n");
  const why = b.discount > 0.001 ? " nach Rabatt" : "";
  return `Hoi ${r.p.name}\n\nDein Thai-Zmittag von ChangThai (${d}):\n${items}\n\nDein Anteil${why}: ${chf(r.share)}\n${s.payNote}\n\nGruss\n${s.sender}`;
}
const normPhone = ph => { let d = String(ph || "").replace(/[^\d+]/g, ""); if (d.startsWith("+")) d = d.slice(1); else if (d.startsWith("00")) d = d.slice(2); else if (d.startsWith("0")) d = "41" + d.slice(1); return d; };
const waLink = (ph, text) => `https://wa.me/${normPhone(ph)}?text=${encodeURIComponent(text)}`;
const smsLink = (ph, text) => `sms:${ph ? "+" + normPhone(ph) : ""}?&body=${encodeURIComponent(text)}`;

function toast(t) {
  const el = document.createElement("div"); el.className = "toast"; el.textContent = t;
  $("#toastRoot").replaceChildren(el); setTimeout(() => el.remove(), 1800);
}
function copy(text, sel) {
  navigator.clipboard.writeText(text).then(() => toast("Kopiert"), () => {
    const el = $(sel); if (!el) return; const r = document.createRange(); r.selectNodeContents(el);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Text markiert, bitte kopieren");
  });
}

/* ---------- views ---------- */
function vOrder() {
  const n = countAll();
  return `
  ${S.isExample ? `<div class="note" style="margin-bottom:12px">Vorausgefüllt mit der Bestellung aus deinem Excel. Mit «Neue Bestellung» leerst du die Menüs, die Namen bleiben.</div>` : ""}
  ${S.people.length ? "" : `<div class="note" style="margin-bottom:12px"><b>Willkommen!</b> Trag unten zuerst deinen eigenen Vornamen ein, danach die Namen deiner Kolleginnen und Kollegen. Das musst du nur einmal machen.</div>`}
  <div class="strip"><div><span class="label">Menüs</span><strong>${n}</strong></div><div><span class="label">Listenpreis</span><strong>${chf(listTotal())}</strong></div></div>
  <div class="stack">
  ${S.people.map(p => {
    const mine = S.orders.filter(o => o.personId === p.id);
    return `<div class="person">
      <div class="person-head"><span class="person-name">${esc(p.name)}${p.me ? ' <span class="muted small">(ich)</span>' : ""}</span>
        ${editPeople ? `<button class="del" data-delp="${p.id}">Entfernen</button>` : `<span class="muted small num">${mine.length ? chf(mine.reduce((s, o) => s + unit(o) * o.qty, 0)) : ""}</span>`}</div>
      <div class="chips">
        ${mine.map(o => `<span class="chip">${o.qty > 1 ? `<b>${o.qty}x</b>` : ""} ${esc(label(o).replace(/ basisscharf$/, ""))}<button aria-label="Entfernen" data-delo="${o.id}">×</button></span>`).join("")}
        <button class="add" data-addfor="${p.id}">+ Menü</button>
      </div></div>`;
  }).join("")}
  </div>
  <form id="addPerson" class="row" style="margin-top:12px">
    <input id="newName" type="text" placeholder="Vorname hinzufügen" autocomplete="off" style="flex:1;min-width:0">
    <button class="btn primary">Hinzufügen</button>
    ${HAS_CONTACTS ? `<button type="button" class="btn sm" id="pickPeople">Aus Kontakten wählen</button>` : ""}
  </form>
  <div class="row" style="margin-top:16px">
    <button class="btn ghost sm" id="toggleEdit">${editPeople ? "Fertig" : "Namen bearbeiten"}</button>
    <button class="btn ghost sm" id="reset">Neue Bestellung</button>
  </div>
  <div id="resetConfirm"></div>`;
}

function vMsg() {
  const s = S.settings, msg = orderMessage(), n = countAll();
  return `
  <div class="grid2">
    <label class="field"><span class="label">Abholzeit</span><input id="time" type="time" value="${esc(s.time)}"></label>
    <label class="field"><span class="label">Gruss von</span><input id="sender" type="text" value="${esc(s.sender)}"></label>
  </div>
  <h2>${n} Menüs an ChangThai</h2>
  <div class="msg" id="orderMsg">${esc(msg)}</div>
  <div class="row" style="margin-top:12px">
    <a class="btn wa" target="_blank" rel="noopener" href="${waLink(s.ctPhone, msg)}">In WhatsApp öffnen</a>
    <button class="btn" id="copyMsg">Kopieren</button>
  </div>
  <p class="note" style="margin-top:14px">«In WhatsApp öffnen» öffnet den Chat mit ChangThai (+${esc(s.ctPhone)}) mit fertigem Text. Du tippst nur noch auf Senden. Vorbestellung über Mittag bis 10:00.</p>`;
}

function vBill() {
  const b = bill();
  if (!b.rows.length) return `<p class="muted">Noch keine Menüs erfasst.</p>`;
  return `
  <label class="field"><span class="label">Effektiv bezahlt (CHF)</span>
    <input id="paid" type="text" inputmode="decimal" placeholder="${b.total.toFixed(2)}" value="${esc(S.bill.paid)}"></label>
  <p class="small muted">Leer lassen, wenn der volle Listenpreis bezahlt wurde.</p>
  <table style="margin-top:12px"><tbody>
    <tr><td>Listenpreis</td><td class="r">${chf(b.total)}</td></tr>
    ${b.discount !== 0 ? `<tr><td>Rabatt</td><td class="r">− ${chf(b.discount)}</td></tr>` : ""}
    <tr><td><b>Bezahlt</b></td><td class="r"><b>${chf(b.paid)}</b></td></tr>
    <tr><td class="muted small">Faktor pro Person</td><td class="r muted small">${(b.f * 100).toFixed(1)} %</td></tr>
  </tbody></table>
  <h2>Pro Person</h2>
  <p class="small muted">Jeder zahlt seinen Listenpreis mal Faktor, gerundet auf 5 Rappen.</p>
  <div class="stack">
  ${b.rows.map(r => r.p.me ? `<div class="payee"><div class="person-head"><span class="person-name">${esc(r.p.name)} <span class="muted small">(ich)</span></span><span class="amt">${chf(r.share)}</span></div></div>` : `
    <div class="payee">
      <div class="person-head"><span class="person-name">${esc(r.p.name)}</span><span class="amt">${chf(r.share)}</span></div>
      <span class="small muted num">Liste ${chf(r.list)}</span>
      <div class="row"><input type="tel" data-phone="${r.p.id}" placeholder="Handynummer, z.B. 079 123 45 67" value="${esc(r.p.phone)}" style="flex:1;min-width:0">
        ${HAS_CONTACTS ? `<button class="btn sm" data-pickphone="${r.p.id}">Kontakt</button>` : ""}</div>
      <div class="row">
        <a class="btn wa sm" target="_blank" rel="noopener" href="${waLink(r.p.phone, payMessage(r))}">WhatsApp</a>
        <a class="btn sm" href="${smsLink(r.p.phone, payMessage(r))}">SMS</a>
        <button class="btn ghost sm" data-copypay="${r.p.id}">Text kopieren</button>
      </div>
      <div class="msg small" id="pay-${r.p.id}" hidden>${esc(payMessage(r))}</div>
    </div>`).join("")}
  </div>
  <label class="field" style="margin-top:16px"><span class="label">Zahlungshinweis in der Nachricht</span>
    <input id="payNote" type="text" value="${esc(S.settings.payNote)}"></label>`;
}

function vMenu() {
  const m = S.menu;
  return `
  ${S.menuWeek ? `<div class="note"><b>Wochenmenü ${esc(S.menuWeek)}</b><br>Wird automatisch aktualisiert, sobald ein neues Menü bereitsteht. Eigene Änderungen hier gelten nur für dich bis zum nächsten Wochenmenü.</div>` : ""}
  <p class="small muted">«Kurzname» landet in der WhatsApp-Nachricht.</p>
  <h2>Gerichte</h2>
  <div class="stack">${m.dishes.map(d => `
    <div class="grid2" style="grid-template-columns:1fr 1fr 70px 32px;align-items:end">
      <label class="field"><span class="label">Name</span><input type="text" data-dish="${d.id}" data-k="name" value="${esc(d.name)}"></label>
      <label class="field"><span class="label">Kurzname</span><input type="text" data-dish="${d.id}" data-k="short" value="${esc(d.short)}"></label>
      <label class="field"><span class="label">Zusatz</span><input type="text" data-dish="${d.id}" data-k="join" value="${esc(d.join)}" placeholder="m/"></label>
      <button class="del" data-deld="${d.id}" aria-label="Gericht entfernen">×</button>
    </div>`).join("")}
    <button class="add" id="addDish" style="justify-self:start">+ Gericht</button>
  </div>
  <h2>Fleisch / Vegi und Preise</h2>
  <div class="stack">
    <div class="prot label"><span>In Nachricht</span><span>klein</span><span>gross</span><span></span></div>
    ${m.proteins.map(p => `<div class="prot">
      <input type="text" data-prot="${p.id}" data-k="msg" value="${esc(p.msg)}">
      <input type="number" step="0.5" data-prot="${p.id}" data-k="small" value="${p.small}">
      <input type="number" step="0.5" data-prot="${p.id}" data-k="large" value="${p.large}">
      <button class="del" data-delpr="${p.id}" aria-label="Entfernen">×</button></div>`).join("")}
    <button class="add" id="addProt" style="justify-self:start">+ Fleisch / Vegi</button>
  </div>
  <h2>Nachricht</h2>
  <div class="stack">
    <label class="field"><span class="label">Begrüssung</span><input type="text" id="greeting" value="${esc(S.settings.greeting)}"></label>
    <label class="field"><span class="label">Schlusssatz</span><input type="text" id="thanks" value="${esc(S.settings.thanks)}"></label>
    <label class="field"><span class="label">WhatsApp ChangThai</span><input type="tel" id="ctPhone" value="${esc(S.settings.ctPhone)}"></label>
  </div>
  <h2>Ich</h2>
  <p class="small muted">Diese Person bekommt keine Zahlungsnachricht.</p>
  <div class="seg">${S.people.map(p => `<button data-me="${p.id}" aria-pressed="${p.me}">${esc(p.name)}</button>`).join("")}</div>
  <h2>Über die App und Datenschutz</h2>
  <div class="note stack" style="gap:8px">
    <p style="margin:0"><b>Inoffizielles Hilfsmittel.</b> Diese App ist ein privates, kostenloses Projekt und kein Angebot von ChangThai. Name und Elefanten-Logo mit freundlicher Genehmigung von ChangThai. Massgebend sind immer das aktuelle Menü und die Preise von ChangThai. Berechnungen ohne Gewähr.</p>
    <p style="margin:0"><b>Deine Daten bleiben auf deinem Handy.</b> Namen, Telefonnummern und Bestellungen werden nur lokal in diesem Browser gespeichert. Es gibt keinen Server, kein Konto, keine Werbung und kein Tracking. Niemand sonst, auch nicht der Betreiber, sieht diese Daten.</p>
    <p style="margin:0"><b>WhatsApp und SMS</b> werden erst geöffnet, wenn du auf den Knopf tippst. Den Text siehst du vorher und schickst ihn selbst ab. Ab dann gelten die Datenschutzbestimmungen von WhatsApp bzw. deines Mobilfunkanbieters.</p>
    <p style="margin:0"><b>Kontakte</b> (nur Android) liest die App nur, wenn du sie selbst auswählst, und speichert nur Vorname und Nummer.</p>
    <p style="margin:0"><b>Hosting:</b> Die App liegt auf GitHub Pages (GitHub Inc., USA). Beim Laden der Seite verarbeitet GitHub technisch bedingt deine IP-Adresse. Schriften und Code werden direkt von dort geladen, nicht von Drittanbietern.</p>
    <p style="margin:0"><b>Löschen:</b> «Alles löschen» unten entfernt alle Daten. Die App deinstallieren tut dasselbe.</p>
    <p style="margin:0"><b>Betreiber und Kontakt:</b> Privatperson, <a href="https://github.com/Lerchox/changthai-zmittag/issues" target="_blank" rel="noopener">github.com/Lerchox/changthai-zmittag</a></p>
  </div>
  <h2>Alles zurücksetzen</h2>
  <button class="btn sm" id="factory">Alles löschen</button>`;
}

function render() {
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  $("#sub").textContent = { order: "Wer möchte was?", msg: "Nachricht an ChangThai", bill: "Betrag pro Person", menu: "Menü und Einstellungen" }[tab];
  $("#view").innerHTML = { order: vOrder, msg: vMsg, bill: vBill, menu: vMenu }[tab]();
}

/* ---------- sheet: add dish ---------- */
let draft = null;
function openSheet(personId) {
  const last = [...S.orders].reverse().find(o => o.personId === personId);
  draft = last ? { ...last, id: null, qty: 1 } : { personId, dish: S.menu.dishes[0]?.id, protein: S.menu.proteins[0]?.id, size: "klein", spice: S.menu.spices[0], qty: 1 };
  draft.personId = personId; renderSheet();
}
function renderSheet() {
  if (!draft) { $("#sheetRoot").innerHTML = ""; return; }
  const p = S.people.find(x => x.id === draft.personId);
  const seg = (key, items, cls = "") => `<div class="seg ${cls}">${items.map(([v, t, sub]) => `<button type="button" data-set="${key}" data-v="${esc(v)}" aria-pressed="${draft[key] === v}">${esc(t)}${sub ? `<small>${sub}</small>` : ""}</button>`).join("")}</div>`;
  $("#sheetRoot").innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-label="Menü wählen">
    <div class="person-head"><span class="person-name" style="font-family:var(--f-display);font-size:1.3rem">${esc(p?.name)}</span><button class="btn ghost sm" id="closeSheet">Abbrechen</button></div>
    <div class="field"><span class="label">Gericht</span>${seg("dish", S.menu.dishes.map(d => [d.id, d.name]))}</div>
    <div class="field"><span class="label">Mit</span>${seg("protein", S.menu.proteins.map(x => [x.id, x.name, `${x.small}.– / ${x.large}.–`]))}</div>
    <div class="field"><span class="label">Grösse</span>${seg("size", [["klein", "klein"], ["gross", "gross"]])}</div>
    <div class="field"><span class="label">Schärfe</span>${seg("spice", S.menu.spices.map(s => [s, s]), "spice")}</div>
    <div class="person-head"><div class="stepper"><button type="button" id="minus" aria-label="weniger">−</button><span class="num">${draft.qty}</span><button type="button" id="plus" aria-label="mehr">+</button></div>
      <span class="num muted">${chf(unit(draft) * draft.qty)}</span></div>
    <div class="msg small">${draft.qty}x ${esc(label(draft))}</div>
    <button class="btn primary" id="confirmAdd" style="justify-content:center;padding:12px">Hinzufügen</button>
  </div></div>`;
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button,a"); if (!t) { if (e.target.id === "scrim") { draft = null; renderSheet(); } return; }
  const d = t.dataset;
  if (d.tab) { tab = d.tab; render(); scrollTo(0, 0); return; }
  if (d.addfor) return openSheet(d.addfor);
  if (d.delo) { S.orders = S.orders.filter(o => o.id !== d.delo); save(); return render(); }
  if (d.delp) { S.people = S.people.filter(p => p.id !== d.delp); S.orders = S.orders.filter(o => o.personId !== d.delp); save(); return render(); }
  if (d.set) { draft[d.set] = d.v; return renderSheet(); }
  if (d.me) { S.people.forEach(p => p.me = p.id === d.me); save(); return render(); }
  if (d.deld) { S.menu.dishes = S.menu.dishes.filter(x => x.id !== d.deld); save(); return render(); }
  if (d.delpr) { S.menu.proteins = S.menu.proteins.filter(x => x.id !== d.delpr); save(); return render(); }
  if (d.pickphone) {
    navigator.contacts.select(["tel"], { multiple: false }).then(([c]) => {
      if (!c || !c.tel || !c.tel.length) return;
      S.people.find(x => x.id === d.pickphone).phone = c.tel[0]; save(); render();
    }).catch(() => {});
    return;
  }
  if (d.copypay) { const el = $("#pay-" + d.copypay); el.hidden = false; return copy(el.textContent, "#pay-" + d.copypay); }
  switch (t.id) {
    case "plus": draft.qty++; return renderSheet();
    case "minus": draft.qty = Math.max(1, draft.qty - 1); return renderSheet();
    case "closeSheet": draft = null; return renderSheet();
    case "confirmAdd": S.orders.push({ ...draft, id: uid() }); S.isExample = false; draft = null; save(); renderSheet(); render(); return toast("Hinzugefügt");
    case "pickPeople":
      navigator.contacts.select(["name", "tel"], { multiple: true }).then(list => {
        for (const c of list) {
          const name = ((c.name && c.name[0]) || "").trim().split(/\s+/)[0];
          if (!name) continue;
          const first = !S.people.length;
          S.people.push({ id: uid(), name, phone: (c.tel && c.tel[0]) || "", me: first });
          if (first && !S.settings.sender) S.settings.sender = name;
        }
        save(); render();
      }).catch(() => {});
      return;
    case "toggleEdit": editPeople = !editPeople; return render();
    case "reset": $("#resetConfirm").innerHTML = `<div class="note row" style="margin-top:10px"><span style="flex:1;min-width:0">Alle Menüs löschen? Namen und Nummern bleiben.</span><button class="btn sm primary" id="resetYes">Ja, leeren</button></div>`; return;
    case "resetYes": S.orders = []; S.bill = { paid: "" }; S.isExample = false; save(); return render();
    case "copyMsg": return copy(orderMessage(), "#orderMsg");
    case "addDish": S.menu.dishes.push({ id: uid(), name: "Neues Gericht", short: "Neu", join: "m/" }); save(); return render();
    case "addProt": S.menu.proteins.push({ id: uid(), name: "Neu", msg: "Neu", small: 15, large: 17 }); save(); return render();
    case "factory": $("#factory").outerHTML = `<button class="btn sm primary" id="factoryYes">Wirklich alles löschen</button>`; return;
    case "factoryYes": S = DEFAULTS(); save(); tab = "order"; return render();
  }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "addPerson") { const n = $("#newName").value.trim(); if (!n) return; const first = !S.people.length; S.people.push({ id: uid(), name: n, phone: "", me: first }); if (first && !S.settings.sender) S.settings.sender = n; save(); render(); $("#newName").focus(); }
});
document.addEventListener("change", e => {
  const t = e.target, d = t.dataset;
  if (["time", "sender", "greeting", "thanks", "ctPhone", "payNote"].includes(t.id)) { S.settings[t.id] = t.id === "ctPhone" ? normPhone(t.value) : t.value; save(); return render(); }
  if (t.id === "paid") { S.bill.paid = t.value.trim(); save(); return render(); }
  if (d.phone) { const p = S.people.find(x => x.id === d.phone); p.phone = t.value.trim(); save(); return render(); }
  if (d.dish) { const x = S.menu.dishes.find(y => y.id === d.dish); x[d.k] = t.value.trim(); if (d.k === "name") x.name = t.value; save(); return; }
  if (d.prot) { const x = S.menu.proteins.find(y => y.id === d.prot); if (d.k === "msg") { if (x.name === x.msg) x.name = t.value.trim(); x.msg = t.value.trim(); } else x[d.k] = parseFloat(t.value) || 0; save(); return; }
});
render();

// Zentrales Wochenmenü aus menu.json laden (gilt für alle Nutzer)
fetch("menu.json", { cache: "no-store" }).then(r => r.ok ? r.json() : null).then(m => {
  if (!m || !m.version || m.version === S.menuVersion) return;
  S.menu.dishes = m.dishes; S.menu.proteins = m.proteins;
  if (m.spices) S.menu.spices = m.spices;
  S.menuVersion = m.version; S.menuWeek = m.week || "";
  save(); render(); toast("Neues Wochenmenü geladen");
}).catch(() => {});

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>

</body>
</html>
